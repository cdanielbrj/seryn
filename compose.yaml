services:
  seryn:
    image: seryn:local
    build: .
    ports:
      - "${SERYN_BIND_ADDRESS:-127.0.0.1}:${SERYN_PORT:-8080}:8080"
    volumes:
      - seryn-data:/data
    environment:
      SERYN_ADMIN_USER: "${SERYN_ADMIN_USER:-admin}"
      SERYN_ADMIN_PASSWORD: "${SERYN_ADMIN_PASSWORD:-}"
      SERYN_ADMIN_PASSWORD_FILE: "${SERYN_ADMIN_PASSWORD_FILE:-}"
      Seryn__RequireHttps: "${SERYN_REQUIRE_HTTPS:-false}"
      Seryn__PublishedBindAddress: "${SERYN_BIND_ADDRESS:-127.0.0.1}"
      Seryn__AllowInsecureRemote: "${SERYN_ALLOW_INSECURE_REMOTE:-false}"
      Seryn__TrustedProxies__0: "${SERYN_TRUSTED_PROXY:-127.0.0.1}"
      Seryn__Security__LoginRateLimit: "${SERYN_LOGIN_RATE_LIMIT:-10}"
      Seryn__Security__ApiRateLimit: "${SERYN_API_RATE_LIMIT:-120}"
      Seryn__Security__LoginLockoutAttempts: "${SERYN_LOGIN_LOCKOUT_ATTEMPTS:-5}"
      Seryn__Security__LoginLockoutSeconds: "${SERYN_LOGIN_LOCKOUT_SECONDS:-300}"
      AllowedHosts: "${SERYN_ALLOWED_HOSTS:-localhost;127.0.0.1}"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
volumes:
  seryn-data:
