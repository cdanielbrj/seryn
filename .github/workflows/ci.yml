name: Continuous Integration

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run backend tests inside Docker
        run: docker build --target server-test --tag seryn:server-test .

      - name: Run frontend checks and tests inside Docker
        run: docker build --target web-test --tag seryn:web-test .

      - name: Build production image
        run: docker build --target final --tag seryn:ci .

  publish:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and publish Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: final
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

  tag:
    needs: [validate, publish]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Read release version
        id: version
        shell: bash
        run: |
          current_version="$(sed -n 's:.*<Version>\([^<]*\)</Version>.*:\1:p' Directory.Build.props)"
          previous_version=""

          if [ -z "$current_version" ]; then
            echo "Directory.Build.props does not define <Version>." >&2
            exit 1
          fi

          if git cat-file -e "${GITHUB_SHA}^:Directory.Build.props" 2>/dev/null; then
            previous_version="$(git show "${GITHUB_SHA}^:Directory.Build.props" | sed -n 's:.*<Version>\([^<]*\)</Version>.*:\1:p')"
          fi

          echo "tag=v${current_version}" >> "$GITHUB_OUTPUT"
          echo "changed=$([[ "$current_version" != "$previous_version" ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Create annotated version tag
        if: steps.version.outputs.changed == 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          git fetch --tags --force
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git rev-parse --verify --quiet "refs/tags/${TAG}" >/dev/null; then
            existing_commit="$(git rev-list -n 1 "$TAG")"
            if [ "$existing_commit" = "$GITHUB_SHA" ]; then
              echo "Tag ${TAG} already points to this commit."
              exit 0
            fi

            echo "Tag ${TAG} already points to ${existing_commit}, not ${GITHUB_SHA}." >&2
            exit 1
          fi

          git tag --annotate "$TAG" --message "Release ${TAG}" "$GITHUB_SHA"
          git push origin "$TAG"
